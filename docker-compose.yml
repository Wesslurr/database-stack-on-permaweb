version: '3.8'

services:
  # 1. Hot Node: Ultra-fast in-memory execution & canonical sequencer (~hymessage@1.0)
  hot-node:
    image: erlang:27-slim
    container_name: hydb-hot-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - hot_node_data:/app/data/node
      - sd_node_1_data:/app/data/node_sd_1:ro
      - sd_node_2_data:/app/data/node_sd_2:ro
      - sd_node_3_data:/app/data/node_sd_3:ro
    ports:
      - "${HOT_HTTP_PORT:-8734}:8734"
      - "${HOT_TCP_PORT:-8736}:8736"
    environment:
      - DB_DIR=/app
      - HYDB_PROFILE=${HYDB_PROFILE:-production}
      - HYDB_CLUSTER_SECRET=${HYDB_CLUSTER_SECRET:?HYDB_CLUSTER_SECRET_must_be_set_min_16_chars}
      - HYDB_ADMIN_TOKEN=${HYDB_ADMIN_TOKEN:?HYDB_ADMIN_TOKEN_must_be_set_min_16_chars}
      - HYDB_CLUSTER_MEMBERS=${HYDB_CLUSTER_MEMBERS:-sd-node-1,sd-node-2,sd-node-3}
      - HYDB_CLUSTER_SIZE=${HYDB_CLUSTER_SIZE:-3}
      - HYDB_HOT_WAL_PATH=/app/data/node/hot_wal.log
      - HYDB_HOT_EPOCH_PATH=/app/data/node/hot_epoch.meta
      - HYDB_MEMBERSHIP_PATH=/app/data/node/cluster_membership.meta
      - HYDB_RECONCILE_WAL_PATH=/app/data/node_sd_1/wal.log,/app/data/node_sd_2/wal.log,/app/data/node_sd_3/wal.log
      - HOT_PORT=8734
      - HOT_TCP_PORT=8736
      - ARWEAVE_GATEWAY=${ARWEAVE_GATEWAY:-http://arlocal:1984}
      - TRUSTED_ARWEAVE_GATEWAYS=http://127.0.0.1:1984,http://arlocal:1984,https://arweave.net,https://ar-io.dev
    command: bash -c "./scripts/start-node.sh && tail -f /dev/null"

  # 2A. State Durability Worker Replica 1 (~sd@1.0) - Designated AO Committer Owner
  sd-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.sd-node
    image: hydb-sd-node:latest
    container_name: hydb-sd-node-1
    restart: on-failure
    working_dir: /app
    depends_on:
      - hot-node
    volumes:
      - .:/app
      - sd_node_1_data:/app/data/node_sd_1
      - committer_data:/app/data/committer
    ports:
      - "${SU_PORT_1:-8735}:8735"
    environment:
      - DB_DIR=/app
      - HYDB_PROFILE=${HYDB_PROFILE:-production}
      - HYDB_NODE_ID=sd-node-1
      - HYDB_COMMITTER_ENABLED=${HYDB_COMMITTER_ENABLED:-true}
      - HYDB_COMMITTER_CURSOR_PATH=/app/data/committer/committer_cursor.json
      - HYDB_CLUSTER_SECRET=${HYDB_CLUSTER_SECRET:?HYDB_CLUSTER_SECRET_must_be_set_min_16_chars}
      - HYDB_ADMIN_TOKEN=${HYDB_ADMIN_TOKEN:?HYDB_ADMIN_TOKEN_must_be_set_min_16_chars}
      - SU_PORT=8735
      - SU_URL=http://127.0.0.1:8735/~sd@1.0
      - HOT_URL=http://hot-node:8734/~hymessage@1.0
      - HOT_NODE_HOST=hot-node
      - HOT_NODE_PORT=8736
      - HYDB_WAL_PATH=/app/data/node_sd_1/wal.log
      - HYDB_EPOCH_PATH=/app/data/node_sd_1/epoch.meta
      - ARWEAVE_GATEWAY=${ARWEAVE_GATEWAY:-http://arlocal:1984}
      - AO_PROCESS_ID=${AO_PROCESS_ID:-}
      - USE_AO_CONNECT=${USE_AO_CONNECT:-false}
      - INTERVAL_MS=3000
      - VERIFY_L1_FINALITY=${VERIFY_L1_FINALITY:-false}
      - L1_GATEWAYS=${L1_GATEWAYS:-https://arweave.net,https://ar-io.dev}
      - MIN_CONFIRMATIONS=${MIN_CONFIRMATIONS:-1}
      - REQUIRE_MULTI_GATEWAY=${REQUIRE_MULTI_GATEWAY:-false}
    command: ./scripts/run-sd-node-foreground.sh

  # 2B. State Durability Worker Replica 2 (~sd@1.0)
  sd-node-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.sd-node
    image: hydb-sd-node:latest
    container_name: hydb-sd-node-2
    restart: on-failure
    working_dir: /app
    depends_on:
      - hot-node
    volumes:
      - .:/app
      - sd_node_2_data:/app/data/node_sd_2
    ports:
      - "${SU_PORT_2:-8745}:8735"
    environment:
      - DB_DIR=/app
      - HYDB_PROFILE=${HYDB_PROFILE:-production}
      - HYDB_NODE_ID=sd-node-2
      - HYDB_COMMITTER_ENABLED=false
      - HYDB_CLUSTER_SECRET=${HYDB_CLUSTER_SECRET:?HYDB_CLUSTER_SECRET_must_be_set_min_16_chars}
      - HYDB_ADMIN_TOKEN=${HYDB_ADMIN_TOKEN:?HYDB_ADMIN_TOKEN_must_be_set_min_16_chars}
      - SU_PORT=8735
      - HOT_NODE_HOST=hot-node
      - HOT_NODE_PORT=8736
      - HYDB_WAL_PATH=/app/data/node_sd_2/wal.log
      - HYDB_EPOCH_PATH=/app/data/node_sd_2/epoch.meta
    command: ./scripts/run-sd-node-foreground.sh

  # 2C. State Durability Worker Replica 3 (~sd@1.0)
  sd-node-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.sd-node
    image: hydb-sd-node:latest
    container_name: hydb-sd-node-3
    restart: on-failure
    working_dir: /app
    depends_on:
      - hot-node
    volumes:
      - .:/app
      - sd_node_3_data:/app/data/node_sd_3
    ports:
      - "${SU_PORT_3:-8755}:8735"
    environment:
      - DB_DIR=/app
      - HYDB_PROFILE=${HYDB_PROFILE:-production}
      - HYDB_NODE_ID=sd-node-3
      - HYDB_COMMITTER_ENABLED=false
      - HYDB_CLUSTER_SECRET=${HYDB_CLUSTER_SECRET:?HYDB_CLUSTER_SECRET_must_be_set_min_16_chars}
      - HYDB_ADMIN_TOKEN=${HYDB_ADMIN_TOKEN:?HYDB_ADMIN_TOKEN_must_be_set_min_16_chars}
      - SU_PORT=8735
      - HOT_NODE_HOST=hot-node
      - HOT_NODE_PORT=8736
      - HYDB_WAL_PATH=/app/data/node_sd_3/wal.log
      - HYDB_EPOCH_PATH=/app/data/node_sd_3/epoch.meta
    command: ./scripts/run-sd-node-foreground.sh

  # 3. Optional Local Arweave Gateway (for local testing/isolated dev)
  arlocal:
    image: node:22-slim
    container_name: hydb-arlocal
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - arlocal_data:/app/.arlocal-db
    ports:
      - "1984:1984"
    command: node scripts/start-arlocal.mjs
    profiles:
      - local-dev

volumes:
  hot_node_data:
  sd_node_1_data:
  sd_node_2_data:
  sd_node_3_data:
  committer_data:
  arlocal_data:
