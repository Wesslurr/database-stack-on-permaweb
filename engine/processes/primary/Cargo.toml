[package]
name = "primary_engine"
version = "0.1.0"
edition = "2021"
description = "HyperStack v2 Primary sequencer: canonical AO process (Rust -> WASM, json-iface@1.0 ABI)"
publish = false

[lib]
# cdylib -> primary_engine.wasm for HyperBEAM (wasm-64@1.0 / WAMR)
# rlib   -> native unit + contract tests (`cargo test`)
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }
# `float_roundtrip` gives correctly rounded f64 parsing (same as Lua tonumber).
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
