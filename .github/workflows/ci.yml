name: HyDB CI

on:
  push:
    branches:
      - beta
      - main
      - master
  pull_request:
    branches:
      - beta
      - main
      - master

jobs:
  conformance-and-specs:
    name: Conformance, AO & SDK Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          rebar3-version: "3.23.0"

      - name: Install Dependencies (Reproducible)
        run: npm ci

      - name: Generate Ephemeral Test Wallets
        run: |
          mkdir -p secrets
          node scripts/gen-wallet.mjs
          node scripts/gen-wallet-su.mjs

      - name: Run Phase 01 Security & Cluster Endpoint Hardening Tests
        run: npm run test:security

      - name: Run Phase 02 WAL Recovery & Data Integrity Tests
        run: npm run test:recovery

      - name: Run Phase 03 Canonical Hash & Fixed Quorum Tests
        run: npm run test:quorum

      - name: Run Phase 04 Idempotency & Write Status Semantics Tests
        run: npm run test:idempotency

      - name: Run Phase 05 Real Multi-Process Chaos & Fault-Injection Suite
        run: npm run test:chaos

      - name: Run Phase 06 AO Settlement Verification & Durable Cursor Suite
        run: npm run test:committer

      - name: Run Cross-Language Conformance Suite (JS, Erlang, Rust, Lua)
        run: npm run test:conformance

      - name: Run AO Arbitrator & Policy Circuit Verification
        run: npm run test:ao

      - name: Run Business Scenarios (Financial Ledger & Gaming State)
        run: npm run test:business

      - name: Start ArLocal Gateway
        run: |
          npx arlocal 1984 > arlocal.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:1984/info; then
              echo "ArLocal is up on :1984"
              break
            fi
            sleep 1
          done
          if [ -f secrets/address.txt ]; then
            curl -sf "http://127.0.0.1:1984/mint/$(cat secrets/address.txt | tr -d '\n\r')/1000000000000000000000" || true
          fi
          if [ -f secrets/address_su.txt ]; then
            curl -sf "http://127.0.0.1:1984/mint/$(cat secrets/address_su.txt | tr -d '\n\r')/1000000000000000000000" || true
          fi

      - name: Run SDK Canonical Manifest & Arweave Publication Tests
        run: npm run test:sdk
